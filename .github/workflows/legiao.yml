name: legiao

# Legião Alpha: cria, revisa e desenha o carrossel do dia da Alpha Dominus e manda a prévia no Telegram.
# Quem dispara é o bot-achados (legiao/gatilho.py, horário em legiao/config.json). Também dá pra rodar na mão.
on:
  workflow_dispatch:

permissions:
  contents: write  # guarda o post na branch legiao-posts pra Íris publicar

concurrency:
  group: legiao
  cancel-in-progress: false

jobs:
  carrossel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar o Claude Code e o Pillow
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install pillow
      - name: Lembrar os temas já postados
        uses: actions/cache/restore@v4
        with:
          path: legiao/historico.json
          key: legiao-${{ github.run_id }}
          restore-keys: legiao-
      - name: Odin, Bragi, Atena e Hefesto
        working-directory: legiao
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          LEGIAO_TELEGRAM_TOKEN: ${{ secrets.LEGIAO_TELEGRAM_TOKEN }}
          LEGIAO_CHAT_ID: ${{ secrets.LEGIAO_CHAT_ID }}
        run: python3 rodar.py
      - name: Guardar os temas
        if: success()
        uses: actions/cache/save@v4
        with:
          path: legiao/historico.json
          key: legiao-${{ github.run_id }}
      - name: Guardar o post pra aprovação (branch legiao-posts)
        if: success() && hashFiles('legiao/saida/status.json') != ''
        run: |
          dia=$(python3 -c "import json;print(json.load(open('legiao/saida/status.json'))['dia'])")
          git config user.name "legiao-bot"
          git config user.email "legiao-bot@users.noreply.github.com"
          if git fetch -q origin legiao-posts; then
            git worktree add -q -B legiao-posts /tmp/posts FETCH_HEAD
          else
            git worktree add -q --orphan -b legiao-posts /tmp/posts
          fi
          rm -rf "/tmp/posts/posts/$dia" && mkdir -p "/tmp/posts/posts/$dia"
          cp legiao/saida/*.jpg legiao/saida/post.json legiao/saida/status.json "/tmp/posts/posts/$dia/"
          cd /tmp/posts && git add -A && git commit -qm "legião: post $dia" && git push -q origin legiao-posts
      - name: Guardar o carrossel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel
          path: legiao/saida/
          if-no-files-found: ignore
