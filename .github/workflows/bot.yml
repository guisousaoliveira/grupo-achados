name: bot-achados

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      servidor:  # não é mais usado; fica para o Render antigo não dar erro ao pedir uma rodada
        required: false
        default: ""
      radar_forcado:  # "1" = botão "Rodar agora" do painel: roda o radar mesmo de madrugada
        required: false
        default: ""
      pedido:  # identifica o clique no painel, para ele mostrar o resultado certo
        required: false
        default: ""

permissions:
  contents: write
  actions: write  # para disparar o Mímir (mimir/gatilho.py)

concurrency:
  group: bot-achados
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_RADAR_FORCADO: ${{ inputs.radar_forcado }}
          BOT_PEDIDO: ${{ inputs.pedido }}
        run: python3 bot.py rodar
      - name: Disparar o Mímir (8h e 16h)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 mimir/gatilho.py
