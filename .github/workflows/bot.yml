name: bot-achados

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-achados
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 bot.py rodar
      - name: Salvar a fila
        run: |
          git config user.name "bot-achados"
          git config user.email "bot-achados@users.noreply.github.com"
          git add dados/estado.json
          git diff --cached --quiet && exit 0
          git commit -m "estado do bot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
