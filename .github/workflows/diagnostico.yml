name: diagnostico

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Links separados por espaço"
        required: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Testar links
        env:
          LINKS: ${{ inputs.links }}
        run: python3 bot.py foto-teste $LINKS
      - name: Vitrine do ML (códigos MLB)
        env:
          LINKS: ${{ inputs.links }}
        run: python3 ferramentas_vitrine.py $LINKS
