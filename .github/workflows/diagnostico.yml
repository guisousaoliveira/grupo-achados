name: diagnostico

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Links separados por espaço"
        required: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Testar links
        env:
          LINKS: ${{ inputs.links }}
          BOT_DEBUG: "1"
        run: python3 bot.py foto-teste $LINKS
