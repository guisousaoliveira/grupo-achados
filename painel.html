<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" type="image/png" href="/painel/logo/leao">
<title>Alpha Promo · Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;--side:#0f0f11;--card:#141416;--card2:#1a1a1d;--line:#232327;--line2:#2e2e33;
  --tx:#ededef;--mut:#8b8b93;--mut2:#5f5f66;
  --gold:#d4af37;--gold2:#e9cb6b;--goldbg:rgba(212,175,55,.10);--goldln:rgba(212,175,55,.35);
  --ok:#3ecf8e;--okbg:rgba(62,207,142,.10);--warn:#f5a524;--warnbg:rgba(245,165,36,.10);--bad:#f2555a;--badbg:rgba(242,85,90,.10);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg{flex:none}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

/* barra lateral */
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand .logo,.mob-top .logo{width:38px;height:38px;border-radius:11px;background:#0b0b0c;border:1px solid var(--goldln);display:grid;place-items:center;flex:none}
.brand .logo img{height:28px}.mob-top .logo img{height:24px}
.brand b{display:block;font-size:14.5px}.brand small{color:var(--mut);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--mut);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:#17171a;color:var(--tx)}
.nav a.on{background:#1b1b1f;color:var(--tx)}
.nav a.on svg{color:var(--gold)}
.nav .badge{margin-left:auto}
.side .fim{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.radarbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#121214}
.radarbox .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.radarbox p{margin:6px 0 10px;color:var(--mut);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.dot.off{background:var(--mut2);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.sair{color:var(--mut);text-decoration:none;font-size:13px;padding:6px 10px;display:flex;gap:8px;align-items:center}
.sair:hover{color:var(--tx)}

/* conteúdo */
main{min-width:0;padding:26px 34px 60px;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#3a3a40;background:#202024}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0b0b0c;font-weight:600}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--tx);background:#1a1a1d}
.btn.bad{color:#ff9a9d}
.btn.bad:hover{background:var(--badbg);border-color:rgba(242,85,90,.4)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{width:30px;padding:0}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:#0b0b0c;font-size:11.5px;font-weight:700}
.badge.mute{background:#26262b;color:var(--mut)}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .k{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:7px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.stat .s{color:var(--mut);font-size:12.5px}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--line2)}
.bar{height:5px;border-radius:9px;background:#232327;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}

.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.box h2{font-size:14.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.box h2 .r{margin-left:auto;font-weight:400}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.abas.mini{margin:0;gap:4px}.abas.mini button{padding:5px 11px;font-size:12px}
.gtab{display:flex;flex-direction:column}
.gr{display:grid;grid-template-columns:minmax(0,1.6fr) .6fr .7fr .7fr 1.3fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.gr.gh{border-top:0;padding-top:0;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.gr.gt{font-weight:700}
.gr .ok{color:#4ade80}.gr .bad{color:#f87171}.gr .gm{color:var(--mut)}
.gf{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb{display:flex;align-items:center;gap:8px}.gb b{font-size:13px;min-width:36px}
.gtx{flex:1;height:6px;border-radius:9px;background:var(--card2);overflow:hidden}.gtx i{display:block;height:100%;background:var(--gold)}
.gh i{font-style:normal}
.hl .rep{flex:none;gap:6px;padding:4px 10px;height:auto}
@media (max-width:700px){.hl .rep{padding:4px 8px;font-size:0;gap:0}.hl .rep svg{width:16px;height:16px}}
.prox-bn{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:18px;border-radius:14px;border:1px solid var(--goldln);background:linear-gradient(90deg,var(--goldbg),transparent)}
.prox-bn .ph{width:58px;height:58px;flex:none}.prox-bn .t{flex:1;min-width:0}
.prox-bn small{display:flex;align-items:center;gap:6px;color:var(--gold2);font-size:12.5px}.prox-bn small b{color:var(--gold2)}
.prox-bn .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.prox-bn .a{display:flex;gap:6px;flex:none}
@media (max-width:700px){.prox-bn{flex-wrap:wrap}.prox-bn .a{width:100%}.prox-bn .a .btn{flex:1;justify-content:center}}
/* janela do story: imagem à esquerda, controles à direita (no celular, um embaixo do outro) */
.modal.st{width:min(860px,calc(100% - 32px));padding:22px}
.st-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.st-hd h3{margin:0;font-size:17px}
.st-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.st-grid .storyimg{margin:0}
.st-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.st-sec{display:flex;flex-direction:column;gap:8px}
.st-lb{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:#0f0f11;border:1px solid var(--line)}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 8px;border-radius:9px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--goldbg);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--goldln)}
.st-frase{display:flex;gap:6px}.st-frase .in{flex:1;min-width:0}.st-frase .btn.icon{width:42px;height:auto;flex:none;justify-content:center}
.st-link{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.st-link:hover{border-color:var(--goldln)}.st-link svg{color:var(--mut);flex:none}
.st-link .t{flex:1;min-width:0;display:flex;flex-direction:column}.st-link b{font-size:14px;font-weight:600}
.st-link small{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}.st-acts .btn{justify-content:center;gap:8px}
@media (max-width:700px){
  .modal.st{padding:16px;top:0;left:0;transform:none;width:100%;height:100%;max-height:none;border-radius:0;border:0}
  .modal.st.on{transform:none}
  .st-grid{grid-template-columns:1fr;gap:16px}
  .st-grid .storyimg{width:auto;height:min(56vh,520px);justify-self:center}
  .st-acts{position:sticky;bottom:-16px;background:var(--card);padding:12px 0 16px;margin-bottom:-16px;border-top:1px solid var(--line)}
}.gh .sm{display:none}
@media (max-width:700px){
  .gr{grid-template-columns:minmax(0,1fr) 44px 26px 26px 40px;gap:8px;font-size:13.5px}
  .gh .lg{display:none}.gh .sm{display:inline}.gr.gh{text-transform:none}
  .gtx{display:none}.gb b{min-width:0}
}
.cols > *,.grid4 > *{min-width:0}

.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{min-width:58px;padding:8px 8px 7px;border-radius:10px;border:1px solid var(--line);background:#111113;text-align:center}
.slot b{display:block;font-size:13.5px}
.slot span{font-size:11px;color:var(--mut)}
.slot.feito{border-color:var(--goldln);background:var(--goldbg)}.slot.feito span{color:var(--gold2)}
.slot.agora{border-color:var(--ok);box-shadow:0 0 0 3px var(--okbg)}.slot.agora span{color:var(--ok)}
.slot.vazio{opacity:.45}

.callout{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;border:1px solid var(--goldln);background:var(--goldbg);margin-bottom:16px}
.callout.warn{border-color:rgba(245,165,36,.4);background:var(--warnbg)}
.callout p{margin:0;flex:1}

/* cartões de oferta */
.list{display:flex;flex-direction:column;gap:10px}
.of{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.of:hover{border-color:var(--line2)}
[data-url]{cursor:pointer}
.of[data-url]:hover{border-color:var(--goldln);background:#17171a}
.of[data-url]:hover .nm{color:var(--gold2)}
.hl[data-url]:hover .n{color:var(--gold2)}
.abrir{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-size:12px}
.of[data-url]:hover .abrir{color:var(--gold2)}
/* links */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lk{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#121214;text-decoration:none}
.lk:hover{border-color:var(--goldln);background:#17171a}
.lk .sg{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.lk b{display:block;font-size:13.5px}.lk small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk div{min-width:0}
.sg.amazon{background:#ff99001f;color:#ffb347}.sg.mercadolivre{background:#ffe6001a;color:#ffe600}.sg.shopee{background:#ee4d2d22;color:#ff7a5c}
.sg.tg{background:#2aabee22;color:#5cc3f5}.sg.gh{background:#ffffff14;color:#ddd}.sg.out{background:var(--goldbg);color:var(--gold2)}
.sg.lg{background:#fff}.sg.lg img{width:24px;height:24px;object-fit:contain}.sg.lg svg{width:21px;height:21px}
.sg.leao{background:#0b0b0c;border:1px solid var(--goldln)}.sg.leao img{height:26px}
.busca{display:flex;gap:8px;flex-wrap:wrap}.busca .in{flex:1;min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{padding:6px 10px;border-radius:99px;border:1px solid var(--line2);text-decoration:none;font-size:13px;color:var(--mut)}
.chips a:hover{border-color:var(--gold);color:var(--tx)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line2);background:none;color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.pchip small{font-size:11px;color:var(--mut)}
.pchip small.bom{color:var(--ok)}
.pchip small.ruim{color:var(--bad)}
.pchip.off{opacity:.45;text-decoration:line-through}
.pchip.blq{border-color:rgba(220,90,90,.45)}
.pchip:hover{border-color:var(--gold)}
.padd{display:flex;gap:8px;margin-top:12px}
.padd .in{flex:1;min-width:0}
.psalvar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px}
.ph{width:92px;height:92px;border-radius:10px;background:#fff;overflow:hidden;display:grid;place-items:center;position:relative}
.ph img{max-width:100%;max-height:100%;object-fit:contain}
.ph.none{background:#141416;border:1px solid var(--line)}
.ph.none img{width:auto;height:40px;max-height:56%;opacity:.35}
.sc .ph.none img{height:64px}
.ph .pos{position:absolute;left:5px;top:5px;background:#0b0b0cdd;color:var(--gold2);font-weight:700;font-size:11.5px;border-radius:6px;padding:1px 6px}
.of .nm{font-weight:600;font-size:14.5px;margin:3px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-orig{display:inline-flex;align-items:center;gap:4px;color:var(--gold2);text-decoration:none;border-bottom:1px dashed var(--goldln)}
.post-orig:hover{color:var(--gold)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--mut);font-size:12.5px}
.tit{color:var(--gold2);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price s{color:var(--mut2);font-size:12.5px}
.price b{color:var(--gold2);font-size:16px}
.off{background:var(--goldbg);color:var(--gold2);border:1px solid var(--goldln);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:600}
.loja{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 3px;border-radius:7px;background:#1f1f23;color:#cfcfd4}
.mk{width:17px;height:17px;border-radius:5px;background:#fff;display:inline-grid;place-items:center;flex:none;overflow:hidden}
.mk img{width:13px;height:13px;object-fit:contain}.mk svg{width:12px;height:12px;color:#111}
.mk.outra{background:#555}
.meta.enx{gap:8px;font-size:12px}
.meta.enx .mk{width:18px;height:18px}
.meta.enx .velho{color:#e8a23a}
.aviso{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;margin-top:6px}
.aviso.bad{color:#f08a8a}.aviso.warn{color:#e8a23a}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--mut)}
.tag.warn{color:var(--warn);border-color:rgba(245,165,36,.4);background:var(--warnbg)}
.tag.bad{color:#ff9a9d;border-color:rgba(242,85,90,.4);background:var(--badbg)}
.tag.ok{color:var(--ok);border-color:rgba(62,207,142,.35);background:var(--okbg)}
.ibar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ibar.seis{grid-template-columns:repeat(6,1fr)}
.ib{height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);cursor:pointer;text-decoration:none;transition:.15s}
.ib:hover{border-color:var(--goldln);color:var(--gold2);background:#1a1a1e}
.ib.bad{color:#f08a8a}.ib.bad:hover{border-color:#6b2b2b;background:#221314;color:#ff9d9d}
.ib .mk{width:20px;height:20px}
.ib.off{opacity:.3;pointer-events:none}
.of[data-edit]{cursor:pointer}
.of[data-edit]:hover{border-color:var(--goldln);background:#17171a}
.of[data-edit]:hover .nm{color:var(--gold2)}
.atalhos{display:flex;gap:12px;flex-wrap:wrap}
.atalhos a{display:inline-flex;align-items:center;gap:5px;color:var(--gold2);text-decoration:none;font-size:12.5px}
.atalhos a:hover{color:var(--gold)}
.atalhos .mk{width:16px;height:16px}
.gerar{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--goldln);border-radius:12px;background:rgba(212,175,55,.06);margin-top:8px}
.gerar p{margin:0;font-size:12.5px;color:var(--mut);flex:1}
.gerar .mk{width:28px;height:28px;flex:none}
.of .side-acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:196px}
.of .row{display:flex;gap:6px;justify-content:flex-end}
.vazio-box{text-align:center;padding:46px 20px;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.vazio-box b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}

/* formulário / editor */
.ed{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.f{display:flex;flex-direction:column;gap:13px}
.fl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:#0f0f11;outline:none}
.in:focus{border-color:var(--gold)}
textarea.in{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;color:var(--tx);font-size:13.5px}
.chk input{width:16px;height:16px;accent-color:var(--gold)}
.fotoed{display:flex;gap:12px;align-items:center}
.fotoed .ph{width:72px;height:72px}
.alert{padding:11px 13px;border-radius:10px;font-size:13.5px;border:1px solid}
.alert.ok{background:var(--okbg);border-color:rgba(62,207,142,.35);color:#b7f0d3}
.alert.warn{background:var(--warnbg);border-color:rgba(245,165,36,.4);color:#ffd99a}
.alert.bad{background:var(--badbg);border-color:rgba(242,85,90,.4);color:#ffc0c2}
.in-ia{position:relative}.in-ia .in{padding-right:44px}
.iafoto{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.iafoto summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;color:var(--gold)}
.iafoto[open] summary{margin-bottom:8px}
.iapassos{margin:0 0 8px;padding-left:20px;font-size:13px;color:var(--mut)}
.iaprompt{white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 8px;max-height:180px;overflow:auto}
.ia-bt{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--gold);display:grid;place-items:center;cursor:pointer}
.ia-bt:hover{background:var(--goldbg)}.ia-bt:disabled{cursor:wait}
.ia-bt.gerando svg{animation:brilho 1s ease-in-out infinite}
@keyframes brilho{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
.in.brilhou{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldbg);transition:.3s}
.iabox{border:1px solid var(--goldln);background:linear-gradient(180deg,rgba(212,175,55,.08),rgba(212,175,55,.02));border-radius:12px;padding:12px}
.iabox .h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.iabox .h b{display:flex;gap:7px;align-items:center;color:var(--gold2)}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sug small{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.chip{text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:#121214;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);background:var(--goldbg)}
.nota{font-size:12.5px;color:var(--mut);font-style:italic;margin-top:8px}

/* prévia estilo Telegram */
.prev{position:sticky;top:20px}
.prev .lbl{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.tg{background:#0e1621;border-radius:14px;padding:14px;border:1px solid #1b2836}
.bub{background:#182533;border-radius:12px;overflow:hidden;max-width:100%}
.bub .im{background:#fff;display:grid;place-items:center;max-height:300px;overflow:hidden}
.bub .im img{max-width:100%;max-height:300px;object-fit:contain}
.bub .ch{color:#6ab3f3;font-weight:600;font-size:13px;padding:9px 12px 0}
.bub .tx{padding:6px 12px 10px;font-size:13.5px;line-height:1.42;word-break:break-word;color:#e9eef4}
.bub .tx s{color:#8fa1b3}
.bub .tx code{background:#0f1a26;padding:1px 4px;border-radius:4px;font-size:12.5px}
.bub .hr{color:#6d7f8f;font-size:11px;text-align:right;padding:0 10px 7px}

/* gaveta e janelas */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:.18s}
.veu.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(940px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer .hd h3{margin:0;font-size:15.5px;flex:1}
.drawer .bd{overflow:auto;padding:20px;flex:1}
.drawer .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer .ft .esq{margin-right:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;z-index:42;background:var(--card);border:1px solid var(--line2);border-radius:16px;width:min(420px,calc(100% - 32px));padding:20px;transition:.18s;max-height:calc(100vh - 40px);overflow:auto}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{margin:0 0 6px;font-size:16px}.modal p{color:var(--mut);margin:0 0 16px}
.modal .acts{justify-content:flex-end}
.modal h3 svg{vertical-align:-3px;color:var(--gold)}
.passos{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.passo{display:flex;align-items:center;gap:10px;color:var(--mut)}
.passo .bola{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.passo.feito{color:var(--tx)}.passo.feito .bola{background:var(--gold);border-color:var(--gold);color:#0b0b0c}
.passo.atual{color:var(--tx)}.passo.atual .bola{border-color:var(--gold);color:var(--gold)}
.passo.atual .spin{width:12px;height:12px;border:2px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite}
.passo.falhou{color:#ffb4b6}.passo.falhou .bola{background:var(--bad);border-color:var(--bad);color:#fff}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.num{background:#0f0f11;border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.num b{display:block;font-size:20px}.num span{font-size:11px;color:var(--mut)}
.storyimg{width:100%;aspect-ratio:9/16;border-radius:12px;background:#0f0f11;display:grid;place-items:center;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.storyimg img{width:100%;height:100%;object-fit:contain}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#1d1d21;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.2s;max-width:calc(100% - 32px);display:flex;gap:9px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.stcfg{display:flex;flex-direction:column;gap:14px}
.stcfg .box{display:flex;flex-direction:column;gap:12px;margin-bottom:0}
.stcfg h2{margin:0}
.stcfg .hint{margin:-4px 0 0}
.fr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fr .in{flex:1}
.fr .cnt{font-size:12px;color:var(--mut2);width:22px;text-align:right}
.fr .ib{width:38px;flex:none}
.frase-st{display:flex;gap:8px;margin-top:12px}
.frase-st .in{flex:1}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.abas button{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--mut);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.abas button span{font-size:11.5px;background:#232327;border-radius:999px;padding:0 7px;color:var(--tx)}
.abas button.on{border-color:var(--goldln);background:var(--goldbg);color:var(--gold2)}
.mk.pb{background:#f0532b;color:#fff;font-weight:800;font-size:11px}
.toast button{background:none;border:0;color:var(--gold2);font:inherit;font-weight:600;cursor:pointer;padding:0 0 0 6px}
.toast.erro{border-color:rgba(242,85,90,.5)}

/* nova oferta */
.colar{display:flex;gap:10px;align-items:flex-start}
.colar textarea{flex:1;min-height:52px}
.hint{color:var(--mut);font-size:12.5px;margin-top:8px}

/* stories */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.sc .ph{width:100%;height:150px;border-radius:0}
.sc .c{padding:11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.sc .c .nm{font-weight:600;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc .btn{margin-top:auto}
.sc .c > .tag,.sc .c > .loja{align-self:flex-start}
.sc.fixo .ph{background:radial-gradient(circle at 50% 35%,#2a2312,#0b0b0c 70%);color:var(--gold)}

/* histórico */
.dia{margin-bottom:18px}
.dia h3{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;font-weight:600}
.hl{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.hl:last-child{border-bottom:0}
.hl .h{color:var(--mut);font-variant-numeric:tabular-nums;width:44px}
.hl .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.semana{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:6px}
.semana div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.semana i{display:block;width:100%;max-width:38px;background:var(--gold);border-radius:6px 6px 3px 3px;min-height:3px;opacity:.85}
.semana span{font-size:11px;color:var(--mut)}
.semana b{font-size:12px}

.mob-top{display:none}
.menu-bt{position:relative;background:none;border:0;color:var(--tx);padding:6px;margin-left:-6px;cursor:pointer;display:grid;place-items:center}
.menu-bt .badge{position:absolute;top:0;right:-4px;min-width:16px;height:16px;font-size:10px;padding:0 4px}

@media (max-width:980px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .ed{grid-template-columns:1fr}
  .prev{position:static}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}

  .nav a{padding:12px 10px;font-size:15px}
  main{padding:16px 16px 40px}
  .top{margin-bottom:16px}
  .top p{display:none}
  .top .acts{width:100%;flex-wrap:wrap}
  .top .acts .btn{flex:1 1 auto}
  .grid4{gap:10px}
  .stat{padding:13px}
  .stat .v{font-size:24px}
  .box{padding:14px}
  .box h2{flex-wrap:wrap;row-gap:6px}
  .slots{display:grid;grid-template-columns:repeat(4,1fr)}
  .slot{min-width:0}
  .hl{padding:9px 4px;gap:10px}
  .hl .n + .loja{font-size:0;gap:0;padding:3px}
  .sgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .sc .ph{height:118px}
  .sc .c{padding:9px 10px}
  .ed .two:has(.chk){grid-template-columns:1fr}
  .mob-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,12,.92);backdrop-filter:blur(8px);z-index:20}
  .mob-top .logo{width:32px;height:32px;border-radius:9px}
  .mob-top b{flex:1}
  .top h1{font-size:19px}
  .of{grid-template-columns:72px 1fr;gap:12px}
  .ph{width:72px;height:72px}
  .of .side-acts{grid-column:1/-1;min-width:0}
  .of .row{justify-content:stretch}.of .row .btn{flex:1}
  .drawer .bd{padding:16px}
  .drawer .ft{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .drawer .ft .btn{flex:1}
  .drawer .ft .esq{flex:0 0 auto}
  .colar{flex-direction:column}.colar .btn{width:100%}
}

</head>

const marca = l => l === 'tg' ? `<span class="mk">${logoImg('telegram')}</span>`
  : `<span class="mk ${LOJAS[l] ? '' : 'outra'}">${l === 'amazon' ? svgSI('amazon') : LOJAS[l] ? logoImg(l) : ''}</span>`;
const loja = l => `<span class="loja">${marca(l)}${esc(LOJAS[l] || 'Outra loja')}</span>`;
const foto = (x, pos) => x.foto
  ? `<div class="ph">${pos ? `<span class="pos">${pos}</span>` : ''}<img src="${esc(x.foto)}" loading="lazy" alt="" onerror="this.parentNode.classList.add('none');this.src='/painel/logo/leao';this.onerror=null"></div>`
  : `<div class="ph none">${pos ? `<span class="pos">${pos}</span>` : ''}<img src="/painel/logo/leao" alt=""></div>`;
function precoHTML(x){
  if (!x.por) return '<span class="tag bad">sem preço</span>';
  const o = offDe(x);
  return `<div class="price">${o ? `<s>${reais(x.de)}</s>` : ''}<b>${reais(x.por)}</b>${o ? `<span class="off">-${o}%</span>` : ''}${x.pix ? '<span class="tag">no Pix</span>' : ''}${x.prime ? '<span class="tag">Prime</span>' : ''}${x.cupom ? `<span class="tag">cupom ${esc(x.cupom)}</span>` : ''}</div>`;
}
function horasDesde(iso){ if (!iso) return 0; return (new Date(E.agora) - new Date(iso)) / 36e5; }
function horaDia(iso){
  const d = new Date(iso), hoje = new Date(E.agora);
  const h = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo'});
  if (d.toDateString() === hoje.toDateString()) return h;
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', timeZone:'America/Sao_Paulo'}) + ' ' + h;
}
function quando(iso){
  const h = horasDesde(iso);
  if (h < 1) { const m = Math.round(h*60); return m < 2 ? 'agora há pouco' : `há ${m} min`; }
  if (h < 24) return `há ${Math.floor(h)}h`;
  return `há ${Math.floor(h/24)} dia(s)`;
}

/* -------- montagem do post (igual ao bot) -------- */
function montarPost(x){
  const b = x.titulo ? [`${x.emoji_titulo || '🚨'} <b>${esc(x.titulo.toUpperCase())}</b>`, `📦 ${esc(x.nome || 'Nome do produto')}`]
    : [`📦 <b>${esc(x.nome || 'Nome do produto')}</b>`];
  const p = [];
  const o = offDe(x);
  const pix = x.pix ? ' no Pix' : '';
  if (x.por && o) p.push(`💰 De <s>${reais(x.de)}</s> por <b>${reais(x.por)}</b>${pix} (${o}% off)`);
  else if (x.por) p.push(`💰 Por <b>${reais(x.por)}</b>${pix}`);
  const np = parseInt(x.parcelas);
  if (x.por && np >= 2 && np <= 24) p.push(`💳 <i>ou ${np}x de ${reais(x.parcela_valor || x.por / np)}${x.parcela_valor ? ` (${reais(np * x.parcela_valor).replace(' ', '\u00a0')})` : ''}</i>`);
  if (x.prime) p.push(`Preço exclusivo para membros Prime${x.sem_prime ? ` (sem Prime: ${reais(x.sem_prime)})` : ''}`);
  if (p.length) b.push(p.join('<br>'));
  if (x.obs) b.push(`📌 ${esc(x.obs)}`);
  if (x.cupom) b.push(/\s/.test(x.cupom.trim()) ? `🎟️ ${esc(x.cupom)}` : `🎟️ Cupom: <code>${esc(x.cupom)}</code>`);  // frase da loja sai sem formato de código
  else if (x.cupom_loja) b.push(`🎟️ ${esc(x.cupom_loja)}`);
  b.push(`🛒 ${esc(x.link || '')}` + (LOJAS[x.loja] ? `  (${LOJAS[x.loja]})` : ''));
  return b.join('<br><br>');
}

/* -------- servidor -------- */
async function api(acao, id, dados){
  const r = await fetch('/painel/api/acao', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({acao, id, dados})});
  if (r.status === 401) { location.reload(); return {}; }
  return r.json();
}
let ULTIMO = '';
async function carregar(forcar, sozinho){
  let texto;
  try {
    const r = await fetch('/painel/api/estado', {cache:'no-store'});
    if (r.status === 401) { location.reload(); return; }
    texto = await r.text();
  } catch(e) { if (forcar) toast('Sem conexão com o servidor.', true); return; }
  // Atualização automática: só redesenha se algo mudou, e não mexe na tela enquanto você edita.
  if (sozinho && texto === ULTIMO) return;
  const antes = E ? E.revisar.length : null;
  ULTIMO = texto; E = JSON.parse(texto);
  const ocupado = ED || document.getElementById('modal').classList.contains('on') || document.getElementById('drawer').classList.contains('on');
  if (sozinho && ocupado) desenharNav(); else desenhar();
  if (sozinho && antes !== null && E.revisar.length > antes) {
    const n = E.revisar.length - antes;
    toast(n === 1 ? 'Chegou 1 oferta nova para revisar.' : `Chegaram ${n} ofertas novas para revisar.`);
    notificar(n === 1 ? 'Nova oferta para revisar' : `${n} ofertas novas para revisar`, E.revisar[0]?.nome || '', 'revisar', 'rev-' + E.revisar[0]?.id);
  }
  avisarProximo();
  if (forcar) toast('Atualizado.');
}
async function fazer(btn, acao, id, dados, depois){
  const antes = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  let r = {};
  try { r = await api(acao, id, dados); } catch(e) { r = {erro:'Sem conexão com o servidor.'}; }
  if (btn) { btn.disabled = false; btn.innerHTML = antes; }
  const desfaz = !r.erro && ['rev_descartar', 'fila_remover', 'rev_descartar_tudo'].includes(acao);
  if (r.erro) toast(r.erro, true); else if (r.ok && !desfaz) toast(r.ok);
  if (!r.erro && depois) depois(r);
  if (!r.erro && acao !== 'ia' && acao !== 'ler_link' && acao !== 'foto') await carregar();
  if (desfaz) toastDesfazer(r.ok.replace(' Dá para desfazer na Lixeira.', ''), acao === 'rev_descartar_tudo');
  return r;
}

/* -------- navegação -------- */
function ir(p){ location.hash = p; }
window.addEventListener('hashchange', () => { pagina = (location.hash.slice(1) || 'inicio'); fecharTudo(); desenhar(); window.scrollTo(0,0); });
function desenharNav(){
  const conta = {revisar: E.revisar.length, fila: E.fila.length};
  document.getElementById('nav').innerHTML = PAGINAS.map(([k,t]) =>
    `<a class="${pagina===k?'on':''}" onclick="ir('${k}')">${ic(k)}${t}${conta[k] ? `<span class="badge ${k==='fila'?'mute':''}">${conta[k]}</span>` : ''}</a>`).join('');
  document.getElementById('mob-t').textContent = (PAGINAS.find(p => p[0] === pagina) || PAGINAS[0])[1];
  document.getElementById('mob-badge').innerHTML = conta.revisar ? `<span class="badge">${conta.revisar}</span>` : '';
  const r = E.radar;
  document.getElementById('radarbox').innerHTML = `<div class="t"><span class="dot ${r.pausado?'off':''}"></span>Radar ${r.pausado?'pausado':'ligado'}</div>
    <p>${r.canais} canais${r.por_hora ? ` · peneira: ${r.peneira} esperando, ${r.por_hora} melhores por hora` : ` · ${r.hoje} achadas hoje`}${r.pausa_de!=null ? ` · pausa ${r.pausa_de}h–${r.pausa_ate}h` : ''}${r.rodada ? `<br>Última rodada ${quandoISO(r.rodada.atualizada)}` : ''}</p>
    <button class="btn sm" style="width:100%" onclick="rodarRadar()">${ic('radar',15)}Rodar agora</button>`;
}
function desenhar(){
  if (!E) return;
  desenharNav();
  const m = document.getElementById('main');
  if (pagina === 'nova' && m.dataset.p === 'nova' && document.getElementById('nova-ed')) return; // não apaga o que você está montando
  m.dataset.p = pagina;
  m.innerHTML = (pagina === 'nova' ? '' : bannerProximo()) + ({inicio, revisar, fila, nova: novaPag, stories, historico, lixeira, links}[pagina] || inicio)();
  if (pagina === 'nova') ligarNova();
}
const topo = (t, s, acts='') => `<div class="top"><div><h1>${t}</h1>${s ? `<p>${s}</p>` : ''}</div><div class="acts">${acts}</div></div>`;

/* -------- próximo post: aviso no painel e notificação do navegador -------- */
const AVISO_MIN = 10;
function proximoInfo(){
  const p = E && E.proximo_post;
  if (!p) return null;
  const x = E.fila.find(f => f.id === p.id);
  if (!x) return null;
  const quando = new Date(p.quando);
  return {x, quando, min: Math.round((quando - Date.now()) / 60000), hm: p.quando.slice(11, 16)};
}
function bannerProximo(){
  const p = proximoInfo();
  if (!p || p.min > AVISO_MIN + 5) return '';
  const falta = p.min <= 0 ? 'saindo agora' : `em ${p.min} min`;
  return `<div class="prox-bn">${foto(p.x)}<div class="t"><small>${ic('relogio',14)}Próximo post às <b>${p.hm}</b> · ${falta}</small><div class="nm">${esc(p.x.nome)}</div>
      <div class="meta">${loja(p.x.loja)}${p.x.por ? `<span>${reais(p.x.por)}</span>` : ''}<span>confira se o preço ainda está certo</span></div></div>
    <div class="a"><button class="btn sm" onclick="editar('fila','${p.x.id}')">${ic('editar',15)}Editar</button>
      <button class="btn sm bad" onclick="fazer(this,'fila_remover','${p.x.id}')">${ic('lixo',15)}Tirar da fila</button></div></div>`;
}
const avisosLigados = () => { try { return 'Notification' in window && Notification.permission === 'granted' && localStorage.getItem('avisos') !== 'off'; } catch(e) { return false; } };
const jaAvisei = new Set();
function notificar(titulo, corpo, pagina, chave){
  if (!avisosLigados() || jaAvisei.has(chave)) return;
  jaAvisei.add(chave);
  try {
    const n = new Notification(titulo, {body: corpo, icon: '/painel/logo/leao', tag: chave});
    n.onclick = () => { window.focus(); ir(pagina); n.close(); };
  } catch(e) {}
}
function avisarProximo(){
  const p = proximoInfo();
  if (p && p.min <= AVISO_MIN && p.min >= -2)
    notificar(`Sai às ${p.hm}: confira o preço`, p.x.nome + (p.x.por ? ` · ${reais(p.x.por)}` : ''), 'fila', 'post-' + p.x.id + '-' + p.hm);
}
async function alternarAvisos(){
  if (!('Notification' in window)) return toast('Este navegador não tem notificações.', true);
  if (avisosLigados()) { try { localStorage.setItem('avisos', 'off'); } catch(e) {} desenhar(); return toast('Avisos do navegador desligados.'); }
  const r = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if (r !== 'granted') return toast('O navegador bloqueou as notificações. Libere no cadeado ao lado do endereço do site.', true);
  try { localStorage.setItem('avisos', 'on'); } catch(e) {}
  desenhar(); toast('Pronto: aviso no navegador quando chegar oferta e uns minutos antes de cada post.');
}
const botaoAvisos = () => `<button class="btn ${avisosLigados() ? 'ghost' : ''}" onclick="alternarAvisos()" title="Notificação no navegador quando chegar oferta para revisar e antes de cada post">${avisosLigados() ? '🔔 Avisos ligados' : '🔕 Ativar avisos'}</button>`;

/* -------- início -------- */
function inicio(){
  const hora = E.hora;
  const ola = hora >= 5 && hora < 12 ? 'Bom dia' : hora >= 12 && hora < 18 ? 'Boa tarde' : 'Boa noite';
  const hoje = E.agora.slice(0,10);
  const postHoje = E.postados.filter(p => p.data.slice(0,10) === hoje);
  const vencidas = E.fila.filter(x => horasDesde(x.aprovado_em) >= E.validade_horas);
  const proxHoras = E.horarios.filter(h => h >= hora && !E.usados_hoje.includes(h)).length;
  const slots = E.horarios.map(h => {
    const feito = E.usados_hoje.includes(h);
    const p = postHoje.find(p => p.slot === h);
    let cls = '', sub = '';
    if (feito) { cls = 'feito'; sub = 'postado'; }
    else if (h === hora) { cls = 'agora'; sub = E.fila.length ? 'agora' : 'fila vazia'; }
    else if (h < hora) { cls = 'vazio'; sub = 'sem post'; }
    else { sub = E.fila.length > (E.horarios.filter(x => x >= hora && x < h && !E.usados_hoje.includes(x)).length) ? 'previsto' : 'livre'; }
    const hm = (E.horarios_hoje || {})[h] || `${h}:${String((E.agenda_hoje || {})[h] || 0).padStart(2,'0')}`;
    return `<div class="slot ${cls}" title="${esc(p ? p.nome : '')}"><b>${hm}</b><span>${sub}</span></div>`;
  }).join('');
  return topo(`${ola}`, `Resumo do Alpha Promo agora, ${new Date(E.agora).toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'})}.`,
      `${botaoAvisos()}<button class="btn" onclick="carregar(true)">Atualizar</button><button class="btn gold" onclick="ir('nova')">${ic('nova',15)}Nova oferta</button>`)
    + (E.revisar.length ? `<div class="callout"><span class="badge">${E.revisar.length}</span><p><b>${E.revisar.length} oferta(s) esperando você.</b> O radar e os seus links caem aqui antes de ir para a fila.</p><button class="btn gold sm" onclick="ir('revisar')">Revisar</button></div>` : '')
    + (vencidas.length ? `<div class="callout warn"><span>⏰</span><p><b>${vencidas.length} na fila há mais de ${E.validade_horas}h.</b> Vale conferir se o preço ainda está de pé.</p><button class="btn sm" onclick="ir('fila')">Ver fila</button></div>` : '')
    + `<div class="grid4">
      <div class="stat click" onclick="ir('fila')"><div class="k">${ic('fila',15)}Na fila</div><div class="v">${E.fila.length}</div><div class="s">${E.fila.length ? `próxima sai ${esc(E.fila[0].previsao)}` : 'fila vazia'}</div></div>
      <div class="stat click" onclick="ir('revisar')"><div class="k">${ic('revisar',15)}Para revisar</div><div class="v">${E.revisar.length}</div><div class="s">${E.revisar.filter(x=>!x.falta.length).length} prontas para aprovar</div></div>
      <div class="stat click" onclick="ir('historico')"><div class="k">${ic('historico',15)}Postadas hoje</div><div class="v">${postHoje.length}</div><div class="s">${proxHoras} horário(s) ainda hoje</div></div>
      <div class="stat"><div class="k">${ic('radar',15)}Radar hoje</div><div class="v">${E.radar.hoje}${E.radar.max_dia ? `<span style="font-size:15px;color:var(--mut);font-weight:500"> / ${E.radar.max_dia}</span>` : '<span style="font-size:15px;color:var(--mut);font-weight:500"> achadas</span>'}</div>${E.radar.max_dia ? `<div class="bar"><i style="width:${Math.min(100, E.radar.hoje/E.radar.max_dia*100)}%"></i></div>` : ''}
        <div class="s" style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px">${E.radar.pausado ? 'pausado' : 'ligado'}${E.radar.rodada ? ` · ${quandoISO(E.radar.rodada.atualizada)}` : ''}<button class="btn sm" onclick="rodarRadar()">Rodar agora</button></div></div>
    </div>
    <div class="box"><h2>Horários de hoje<span class="r tag">um post por horário, se tiver fila</span></h2><div class="slots">${slots}</div></div>
    ${garimpoBox()}
    <div class="cols">
      <div class="box"><h2>Próximas a sair<a class="r btn sm ghost" onclick="ir('fila')">Ver fila toda</a></h2>
        ${E.fila.length ? `<div class="list">${E.fila.slice(0,3).map((x,i) => `<div class="hl" style="padding:8px 0" ${x.url ? `data-url="${esc(x.url)}"` : ''}>${foto(x)}<div style="min-width:0;flex:1"><div class="nm" style="font-weight:600">${esc(x.nome)}</div><div class="meta">${loja(x.loja)}<span>${esc(x.previsao)}</span>${x.por?`<span>${reais(x.por)}</span>`:''}</div></div></div>`).join('').replaceAll('class="ph', 'style="width:52px;height:52px" class="ph')}</div>` : `<div class="vazio-box" style="padding:26px"><b>Fila vazia</b>Aprove ofertas em Revisar ou cole um link em Nova oferta.</div>`}
      </div>
      <div class="box"><h2>Últimas postadas<a class="r btn sm ghost" onclick="ir('stories')">Gerar story</a></h2>
        ${E.postados.slice(0,5).map(p => `<div class="hl" style="padding:8px 0" ${p.url ? `data-url="${esc(p.url)}"` : ''}><span class="h" style="width:auto;min-width:44px">${p.data.slice(0,10) === hoje ? '' : p.data.slice(8,10) + '/' + p.data.slice(5,7) + ' '}${p.data.slice(11,16)}</span><span class="n">${esc(p.nome)}</span>${loja(p.loja)}</div>`).join('') || '<p style="color:var(--mut);margin:0">Nada postado ainda.</p>'}
      </div>
    </div>`;
}

let garPer = 'hoje';
function garimpoBox(){
  const dias = Object.keys(E.garimpo || {}).sort();
  const hoje = E.agora.slice(0,10);
  const ontem = new Date(new Date(hoje + 'T12:00:00').getTime() - 864e5).toISOString().slice(0,10);
  const usar = garPer === 'hoje' ? [hoje] : garPer === 'ontem' ? [ontem] : dias.slice(-7);
  const soma = {};
  usar.forEach(d => Object.entries((E.garimpo || {})[d] || {}).forEach(([f, v]) => {
    const t = soma[f] = soma[f] || {achados:0, aprovados:0, reprovados:0};
    t.achados += v.achados || 0; t.aprovados += v.aprovados || 0; t.reprovados += v.reprovados || 0;
  }));
  const linhas = Object.entries(soma).sort((a, b) => b[1].achados - a[1].achados || b[1].aprovados - a[1].aprovados);
  const tot = linhas.reduce((t, [, v]) => ({achados: t.achados + v.achados, aprovados: t.aprovados + v.aprovados, reprovados: t.reprovados + v.reprovados}), {achados:0, aprovados:0, reprovados:0});
  const taxa = v => { const d = v.aprovados + v.reprovados; return d ? Math.round(v.aprovados / d * 100) : null; };
  const barra = v => { const t = taxa(v); return t === null ? '<span class="gm">—</span>' : `<span class="gtx"><i style="width:${t}%"></i></span><b>${t}%</b>`; };
  const nome = f => f === 'promobit' ? '<span class="mk pb">P</span>Promobit' : f === 'shopee' ? `${marca('shopee')}Shopee (API)` : `${marca('tg')}@${esc(f)}`;
  const per = [['hoje','Hoje'],['ontem','Ontem'],['7d','7 dias']].map(([k,t]) => `<button class="${garPer===k?'on':''}" onclick="garPer='${k}';desenhar()">${t}</button>`).join('');
  return `<div class="box"><h2>Placar do garimpo<span class="r abas mini">${per}</span></h2>
    ${linhas.length ? `<div class="gtab"><div class="gr gh"><span>Fonte</span><span>Achou</span><span><i class="lg">Aprovou</i><i class="sm">✓</i></span><span><i class="lg">Reprovou</i><i class="sm">✕</i></span><span><i class="lg">Aproveitamento</i><i class="sm">%</i></span></div>
      ${linhas.map(([f, v]) => `<div class="gr"><span class="gf">${nome(f)}</span><span>${v.achados}</span><span class="ok">${v.aprovados}</span><span class="bad">${v.reprovados}</span><span class="gb">${barra(v)}</span></div>`).join('')}
      <div class="gr gt"><span>Total</span><span>${tot.achados}</span><span class="ok">${tot.aprovados}</span><span class="bad">${tot.reprovados}</span><span class="gb">${barra(tot)}</span></div></div>
      <p class="hint" style="margin:10px 0 0">Conta pelo dia em que a oferta foi achada. O que ainda está em Revisar não entra no aproveitamento.</p>`
    : `<p style="color:var(--mut);margin:0">${garPer === 'hoje' ? 'Nada garimpado hoje ainda.' : 'Sem dados nesse período (o placar começou a contar hoje).'}</p>`}
  </div>`;
}

/* -------- revisar -------- */
let revFonte = 'todas';
const fonteDe = x => x.fonte === 'promobit' ? 'promobit' : x.fonte === 'shopee' ? 'shopee' : (x.origem ? 'telegram' : 'manual');
function revisar(){
  const conta = {todas: E.revisar.length, telegram: 0, promobit: 0, shopee: 0, manual: 0};
  E.revisar.forEach(x => conta[fonteDe(x)]++);
  if (revFonte !== 'todas' && !conta[revFonte]) revFonte = 'todas';
  const lista = revFonte === 'todas' ? E.revisar : E.revisar.filter(x => fonteDe(x) === revFonte);
  const abas = [['todas','Todas'],['telegram','Canais do Telegram'],['promobit','Promobit'],['shopee','Shopee'],['manual','Seus links']]
    .filter(([k]) => k === 'todas' || conta[k])
    .map(([k,t]) => `<button class="${revFonte===k?'on':''}" onclick="revFonte='${k}';desenhar()">${t}<span>${conta[k]}</span></button>`).join('');
  const prontas = E.revisar.filter(x => !x.falta.length).length;
  return topo('Revisar', 'Ofertas do radar e links que você mandou, as mais recentes primeiro. Só vai para a fila o que você aprovar.',
      `<button class="btn ghost" onclick="ir('lixeira')">${ic('lixeira',16)}Lixeira${E.lixeira.length ? ` (${E.lixeira.length})` : ''}</button>`
      + (E.revisar.length > 1 ? `<button class="btn bad" onclick="confirmar('Descartar todas as ${E.revisar.length}?', 'Elas vão para a Lixeira, e dá para trazer de volta.', 'Descartar todas', () => fazer(null,'rev_descartar_tudo'))">Descartar todas</button>` : '')
      + (prontas > 1 ? `<button class="btn gold" onclick="fazer(this,'rev_aprovar_tudo')">Aprovar as ${prontas} completas</button>` : ''))
    + (E.revisar.length ? `<div class="abas">${abas}</div><div class="list">${lista.map(cardRevisao).join('')}</div>`
      : `<div class="vazio-box"><b>Nada para revisar</b>Quando o radar achar algo do nicho, aparece aqui (e no seu Telegram).</div>`);
}
function cardRevisao(x){
  // Card enxuto: loja, canal e hora numa linha; nome e preço; no máximo um aviso embaixo.
  const velho = x.garimpado_em && horasDesde(x.garimpado_em) >= 6;
  const info = [x.fonte === 'promobit' ? 'Promobit' : x.fonte === 'shopee' ? 'Shopee (API)' : x.origem ? '@' + esc(x.origem) : 'seu link', x.garimpado_em ? `<span class="${velho ? 'velho' : ''}">${horaDia(x.garimpado_em)}</span>` : ''].filter(Boolean).join(' · ');
  const conferirO = [];
  if (x.loja === 'shopee' && x.origem && !x.shopee_api) conferirO.push('produto');
  if (x.foto_origem === 'canal') conferirO.push('foto');
  if (x.aviso_preco || x.preco_loja) conferirO.push('preço');
  let aviso = '';
  if (x.ler_depois) aviso = `<div class="aviso warn">${ic('relogio',13)}A loja bloqueou, vou ler de novo</div>`;
  else if (x.falta.length) aviso = `<div class="aviso bad">${ic('link',13)}Falta ${esc(x.falta.join(', '))}</div>`;
  else if (conferirO.length) aviso = `<div class="aviso warn" title="Abra o post original para conferir">Conferir ${conferirO.join(', ')}</div>`;
  const conferir = x.link_produto || x.link;
  const nomeLoja = LOJAS[x.loja] || 'loja';
  return `<div class="of" data-edit="revisar" data-id="${esc(x.id)}" title="Clique para revisar">${foto(x)}
    <div style="min-width:0"><div class="meta enx">${marca(x.loja)}<span>${info}</span></div>
      <div class="nm">${esc(x.nome || x.link)}</div>${precoHTML(x)}${aviso}</div>
    <div class="side-acts">
      <button class="btn gold sm" ${x.falta.length ? 'disabled title="Complete pelo editor"' : ''} onclick="fazer(this,'rev_aprovar','${x.id}')">Aprovar</button>
      <div class="ibar">
        <button class="ib" title="Editar" onclick="editar('revisar','${x.id}')">${ic('editar',16)}</button>
        <a class="ib ${x.post_origem ? '' : 'off'}" ${x.post_origem ? `href="${esc(x.post_origem)}"` : ''} target="_blank" rel="noopener" title="${x.fonte === 'promobit' ? 'Ver a oferta no Promobit' : 'Ver o post original no Telegram'}">${x.fonte === 'promobit' ? '<span class="mk pb">P</span>' : marca('tg')}</a>
        <a class="ib ${conferir ? '' : 'off'}" href="${esc(conferir)}" target="_blank" rel="noopener" title="Ver o produto na ${esc(nomeLoja)}">${marca(x.loja)}</a>
        <button class="ib bad" title="Descartar" onclick="fazer(this,'rev_descartar','${x.id}')">${ic('lixo',16)}</button>
      </div>
    </div></div>`;
}

let ED = null; // {ctx, id, x}
function editar(ctx, id){
  const x = (ctx === 'fila' ? E.fila : E.revisar).find(y => y.id === id);

  ED = {ctx, id, x: {...x}};
  document.getElementById('dr-t').textContent = ctx === 'fila' ? 'Editar oferta da fila' : 'Revisar oferta';
  document.getElementById('dr-b').innerHTML = editorHTML(ED.x, 'dr');

  if (ctx === 'fila') f.innerHTML = `<button class="btn bad esq" onclick="acaoEditor(this,'fila_remover')">Remover</button>

      <button class="btn gold" onclick="acaoEditor(this,'fila_postar')">Salvar e postar agora</button>`;
  else f.innerHTML = `<button class="btn bad esq" onclick="acaoEditor(this,'rev_descartar')">Descartar</button>
      <button class="btn" onclick="acaoEditor(this,'rev_salvar')">Salvar</button>

async function acaoEditor(btn, acao){
  if (acao === 'fila_postar' && !await confirmarP('Postar agora no canal?', 'Salva as mudanças e posta já.', 'Postar agora')) return;
  const r = await fazer(btn, acao, ED.id, dadosForm('dr', ED.x));
  if (!r.erro) fecharTudo();
}
function abrirMenu(){
  document.getElementById('side').classList.add('aberta');
  document.getElementById('veu').classList.add('on');
}
function fecharTudo(){
  ['veu','drawer','modal'].forEach(i => document.getElementById(i).classList.remove('on'));

}

function gerarLinkHTML(x){
  const g = GERADOR[x.loja];

async function gerarLink(lojaId, url){
  let ok = true;
  try { await navigator.clipboard.writeText(url); } catch { ok = false; }
  window.open(GERADOR[lojaId][1], '_blank', 'noopener');

const FORM = ['titulo','nome','de','por','sem_prime','cupom','obs','link','parcelas','parcela_valor'];
const textoParcelas = x => x.parcelas ? `${x.parcelas}x${x.parcela_valor ? ' ' + num(x.parcela_valor) : ''}` : '';
function lerParcelas(t){  // mesmo jeito do bot: "4", "10x 39,90"
  const m = String(t || '').match(/(\d{1,2})\s*(?:x|vezes)?(?:\s*(?:de)?\s*(?:R\$)?\s*(\d[\d.]*,\d{2}|\d+(?:\.\d{2})?))?/i);
  if (!m || +m[1] < 2 || +m[1] > 24) return {parcelas: 0, parcela_valor: 0};
  return {parcelas: +m[1], parcela_valor: m[2] ? preco(m[2]) : 0};
}
function dadosForm(p, x){
  const g = k => document.getElementById(`${p}-${k}`).value.trim();
  const d = {}; FORM.forEach(k => d[k] = g(k));
  d.prime = document.getElementById(`${p}-prime`).checked;
  d.pix = document.getElementById(`${p}-pix`).checked;
  if (d.parcela_valor && /^\d{1,2}$/.test(d.parcelas)) d.parcelas = `${d.parcelas}x ${d.parcela_valor}`;  // o servidor lê "3x 32,33"
  delete d.parcela_valor;
  if (x._foto_nova) d.foto = x._foto_nova;
  return d;
}
function ligarEditor(p, x){
  const atual = () => {
    const d = dadosForm(p, x);
    const y = {...x, ...d, foto: x.foto, de: preco(d.de), por: preco(d.por), sem_prime: preco(d.sem_prime), ...lerParcelas(d.parcelas)};  // d.foto é o código do Telegram; a prévia usa o endereço
    if (!d.cupom) { y.cupom = ''; y.cupom_loja = ''; }  // campo vazio tira o cupom (o servidor faz igual ao salvar)
    document.getElementById(`${p}-bub`).innerHTML = (y.foto ? `<div class="im"><img src="${esc(y.foto)}" alt="" onerror="this.parentNode.remove()"></div>` : '')

function iaPrompt(p){
  const s = IAF[p]; if (!s) return '';
  const nome = (document.getElementById(`${p}-nome`)?.value || s.x.nome || 'the product').trim();
  const cenas = (IA_CENAS.find(([re]) => re.test(nome)) || [null, IA_GERAL])[1];
  let h = 0; for (const c of String(s.x.chave || nome)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const i = (h + s.n) % cenas.length, cam = IA_CAMERA[(h + s.n * 3) % IA_CAMERA.length];
  return `Create a realistic, high-end product photo of this exact product: "${nome}".\n`
    + `Use the attached photo as the reference: keep the product's shape, colors, logo and label exactly the same, do not invent a different product.\n`
    + `Scene: the product ${cenas[i]}. ${cam}.\n`
    + `Style: photorealistic, like a real smartphone photo from a premium store, sharp focus on the product, natural shadows.\n`
    + `Square 1:1 image. No text, no price, no watermark, no extra logos.`;
}

async function iaCopiarFoto(p){
  const f = IAF[p]?.x.foto;
  if (!f) return toast('Essa oferta ainda não tem foto. Envie uma antes.', true);
  const url = f.startsWith('http') ? '/painel/foto?f=' + encodeURIComponent(f) : f;  // passa pelo servidor: copiar imagem de outro site é bloqueado
  try {
    const png = fetch(url).then(r => { if (!r.ok) throw 0; return r.blob(); }).then(b => createImageBitmap(b)).then(bm => {
      const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height; c.getContext('2d').drawImage(bm, 0, 0);
      return new Promise(res => c.toBlob(res, 'image/png'));
    });
    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    toast('Foto copiada. Cole no Gemini.');
  } catch(e) {
    window.open(url, '_blank');
    toast('Não deu pra copiar aqui. Abri a foto: salve e envie no Gemini.', true);
  }
}

async function subirFoto(p, f){
  if (!f || !f.type.startsWith('image/')) return toast('Isso não é uma imagem.', true);
  toast('Enviando foto…');
  const ph = document.getElementById(`${p}-fotoph`);
  if (ph) ph.style.opacity = .5;
  let r;
  try { r = await api('foto', '', {imagem: await reduzir(f)}); } catch(e) { r = {erro:'Sem conexão com o servidor.'}; }
  if (ph) ph.style.opacity = '';
  if (r.erro) return toast(r.erro, true);

// Ctrl+V com uma imagem copiada: vira a foto da oferta aberta (editor ou Nova oferta).
function editorAberto(){
  if (ED && document.getElementById('drawer').classList.contains('on')) return 'dr';
  if (pagina === 'nova' && nova.item && document.getElementById('nv-fotoph')) return 'nv';
  return null;
}
document.addEventListener('paste', e => {
  const p = editorAberto(); if (!p) return;
  const img = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!img) return;
  e.preventDefault();
  subirFoto(p, img.getAsFile());
});
// Arrastar uma imagem para a tela também funciona.
document.addEventListener('dragover', e => { if (editorAberto() && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  const p = editorAberto(); if (!p) return;
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
  if (!f) return;
  e.preventDefault();
  subirFoto(p, f);
});
function reduzir(f){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width*k; c.height = img.height*k;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', .9));
    };
    img.src = URL.createObjectURL(f);
  });
}

/* -------- histórico -------- */
function historico(){
  const dias = {};
  E.postados.forEach(p => (dias[p.data.slice(0,10)] = dias[p.data.slice(0,10)] || []).push(p));
  const hoje = new Date(E.agora);
  const nomeDia = d => { const dt = new Date(d+'T12:00'); const diff = Math.round((new Date(E.agora.slice(0,10)+'T12:00') - dt)/864e5);
    return diff === 0 ? 'Hoje' : diff === 1 ? 'Ontem' : dt.toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'short'}); };
  const semana = [...Array(7)].map((_,i) => { const d = new Date(hoje); d.setDate(d.getDate() - (6-i)); const k = d.toLocaleDateString('sv-SE'); return [k, (dias[k]||[]).length, d]; });
  const max = Math.max(1, ...semana.map(s => s[1]));
  const porLoja = {}; semana.forEach(([k]) => (dias[k]||[]).forEach(p => porLoja[p.loja] = (porLoja[p.loja]||0) + 1));
  return topo('Histórico', 'O que saiu no canal nos últimos 30 dias.')
    + `<div class="cols"><div class="box"><h2>Últimos 7 dias</h2><div class="semana">${semana.map(([k,n,d]) => `<div><b>${n}</b><i style="height:${n/max*70}%"></i><span>${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span></div>`).join('')}</div></div>
      <div class="box"><h2>Por loja (7 dias)</h2>${Object.entries(porLoja).sort((a,b)=>b[1]-a[1]).map(([l,n]) => `<div class="hl" style="padding:8px 0">${loja(l)}<span class="n"></span><b>${n}</b></div>`).join('') || '<p style="color:var(--mut);margin:0">Nada ainda.</p>'}</div></div>`
    + Object.keys(dias).sort().reverse().map(d => `<div class="dia"><h3>${nomeDia(d)} · ${dias[d].length}</h3><div class="box" style="padding:4px 6px">${dias[d].map(p => `<div class="hl" ${p.url ? `data-url="${esc(p.url)}" title="Abrir o produto"` : ''}><span class="h">${p.data.slice(11,16)}</span><span class="n">${esc(p.nome)}</span>${loja(p.loja)}${p.repostar ? `<button class="btn sm ghost rep" title="Volta para a fila em 1º lugar, para editar e postar de novo" onclick="fazer(this,'hist_repostar',${esc(JSON.stringify(p.chave))})">${ic('sortear',14)}Repostar</button>` : ''}</div>`).join('')}</div></div>`).join('');
}

/* -------- palavras do garimpo: liga/desliga, novas e bloqueadas (salva no estado; vale na próxima rodada) -------- */
let PAL = null;  // edição em andamento (não some quando o painel atualiza sozinho)
function palEstado(){
  if (!PAL || !PAL.mudou) PAL = {lista: E.palavras.lista.map(x => ({...x})), bloqueadas: [...E.palavras.bloqueadas], mudou: false};
  return PAL;
}
function palavrasBox(){
  const P = palEstado();
  const ord = [...P.lista].sort((a, b) => (b.a + b.r) - (a.a + a.r) || a.p.localeCompare(b.p));
  const pct = x => {
    const t = x.a + x.r;
    if (!t) return '';
    const v = Math.round(x.a / t * 100);
    return `<small class="${t >= 4 && v >= 30 ? 'bom' : t >= 4 && v < 10 ? 'ruim' : ''}" title="${x.a} aprovada(s) de ${t}">${v}% · ${t}</small>`;
  };
  return `<div class="box"><h2>Palavras do garimpo<span class="r tag">${P.lista.filter(x => x.on).length} ligadas</span></h2>
    <p class="hint" style="margin-top:0">O radar só traz produto com uma dessas palavras <b>no nome</b>. Toque para desligar ou ligar. O número é quanto você aprova do que ela trouxe (e quantas trouxe); a peneira usa isso para escolher as melhores.</p>
    <div class="pchips">${ord.map(x => `<button class="pchip ${x.on ? '' : 'off'}" onclick="palAlternar('${esc(x.p)}')">${esc(x.p)}${pct(x)}</button>`).join('')}</div>
    <div class="padd"><input class="in" id="pal-nova" placeholder="Nova palavra, ex.: camisa de time" onkeydown="if(event.key==='Enter')palAdd('nova')"><button class="btn" onclick="palAdd('nova')">Adicionar</button></div>
    <h2 style="margin-top:22px">Palavras bloqueadas<span class="r tag">${P.bloqueadas.length}</span></h2>
    <p class="hint" style="margin-top:0">Se o nome do produto tiver uma dessas, o radar ignora, mesmo que tenha uma palavra ligada (ex.: <i>fone gamer</i>).</p>
    <div class="pchips">${P.bloqueadas.map(b => `<button class="pchip blq" onclick="palDesbloquear('${esc(b)}')" title="Tirar do bloqueio">${esc(b)} <small>✕</small></button>`).join('') || '<span class="hint">Nenhuma.</span>'}</div>
    <div class="padd"><input class="in" id="pal-blq" placeholder="Bloquear palavra, ex.: infantil" onkeydown="if(event.key==='Enter')palAdd('blq')"><button class="btn" onclick="palAdd('blq')">Bloquear</button></div>
    ${P.mudou ? `<div class="psalvar"><button class="btn ghost" onclick="PAL=null;desenhar()">Desfazer</button><button class="btn gold" onclick="palSalvar(this)">Salvar palavras</button></div>` : ''}</div>`;
}
function palAlternar(p){ const x = PAL.lista.find(x => x.p === p); if (x) { x.on = !x.on; PAL.mudou = true; desenhar(); } }
function palDesbloquear(b){ PAL.bloqueadas = PAL.bloqueadas.filter(x => x !== b); PAL.mudou = true; desenhar(); }
function palAdd(tipo){
  const el = document.getElementById(tipo === 'blq' ? 'pal-blq' : 'pal-nova');

  else { const x = PAL.lista.find(x => x.p === v); if (x) x.on = true; else PAL.lista.push({p: v, on: true, nova: true, a: 0, r: 0}); }
  PAL.mudou = true; desenhar();
  setTimeout(() => { const e = document.getElementById(tipo === 'blq' ? 'pal-blq' : 'pal-nova'); if (e) e.focus(); }, 0);
}

/* -------- radar: rodar agora com andamento -------- */
function quandoISO(iso){
  if (!iso) return '';
  const min = Math.round((Date.now() - new Date(iso)) / 6e4);
  return min < 1 ? 'agora há pouco' : min < 60 ? `há ${min} min` : `há ${Math.floor(min/60)}h${String(min%60).padStart(2,'0')}`;
}
let RADAR = null;
const PASSOS = [['pedido','Pedido enviado ao GitHub'],['rodando','Lendo os canais'],['pronto','Resultado']];
function desenharRadar(fase, info){
  const ordem = {pedido:0, rodando:1, salvando:1, pronto:2, erro:1};
  const i = ordem[fase] ?? 0;
  const seg = Math.round((Date.now() - RADAR.inicio) / 1000);
  const passos = PASSOS.map(([k,t], j) => {
    const st = j < i || fase === 'pronto' ? 'feito' : j === i ? (fase === 'erro' ? 'falhou' : 'atual') : '';
    return `<div class="passo ${st}"><span class="bola">${st === 'feito' ? '✓' : st === 'falhou' ? '!' : st === 'atual' ? '<span class="spin"></span>' : j+1}</span><span>${t}</span></div>`;
  }).join('');
  let corpo = '';
  if (fase === 'pronto') corpo = resultadoRadar(info);
  else if (fase === 'erro') corpo = `<div class="alert bad">A rodada deu erro no GitHub. <a href="${esc(info.run.url)}" target="_blank" rel="noopener">Ver o log</a></div>`;
  else if (seg > 240) corpo = `<div class="alert warn">Está demorando mais que o normal. Pode fechar: se aparecer algo, cai em Revisar e no seu Telegram.${info && info.run ? ` <a href="${esc(info.run.url)}" target="_blank" rel="noopener">Ver no GitHub</a>` : ''}</div>`;
  else corpo = `<p class="hint" style="margin:0">${fase === 'pedido' ? 'Esperando o GitHub começar' : 'O GitHub está lendo os canais'}… ${seg}s. Costuma levar menos de 1 minuto.</p>`;
  const m = document.getElementById('modal');
  m.innerHTML = `<h3>${ic('radar',17)} Rodada do radar</h3><div class="passos">${passos}</div>${corpo}
    <div class="acts" style="margin-top:16px">${fase === 'pronto' && (info.ultima.soltas ?? info.ultima.novas) ? `<button class="btn gold" onclick="fecharTudo();ir('revisar')">Ver em Revisar</button>` : ''}<button class="btn ${fase === 'pronto' ? '' : 'ghost'}" onclick="fecharRadar()">Fechar</button></div>`;
}
function resultadoRadar(info){
  const u = info.ultima;
  const n = (v, t) => `<div class="num"><b>${v}</b><span>${t}</span></div>`;
  let frase;
  if (u.soltas) frase = `<div class="alert ok"><b>${u.soltas} oferta(s)</b> foram para Revisar (e para o seu Telegram).${u.na_peneira ? ` Mais ${u.na_peneira} na peneira esperando a próxima hora.` : ''}</div>`;
  else if (u.novas && u.na_peneira) frase = `<div class="alert ok"><b>${u.novas} oferta(s) nova(s)</b> entraram na peneira. As ${E.radar.por_hora} melhores de cada hora vão para Revisar.</div>`;
  else if (u.lidos === 0) frase = `<div class="alert bad">Não consegui ler nenhum canal agora. Tente de novo em alguns minutos.</div>`;
  else if (!u.posts_novos) frase = `<div class="alert warn">Os canais não postaram nada novo desde a última leitura. Nada para trazer.</div>`;
  else if (u.limite_hora) frase = `<div class="alert warn">Já chegaram ${E.radar.max_hora} ofertas nesta hora. As próximas entram na hora que vem, para espalhar pelo dia.</div>`;
  else if (u.limite_dia) frase = `<div class="alert warn">Chegou no limite de ${E.radar.max_dia} ofertas por dia. O radar volta amanhã.</div>`;
  else if (!u.do_nicho) frase = `<div class="alert warn">Teve ${u.posts_novos} post(s) novo(s), mas nenhum do nicho (academia, estilo, games, ferramentas…).</div>`;
  else frase = `<div class="alert warn">As ${u.do_nicho} oferta(s) do nicho já tinham aparecido antes (fila, revisão ou já vistas).</div>`;
  return `<div class="nums">${n(`${u.lidos}/${u.canais}`, 'canais lidos')}${n(u.posts_novos, 'posts novos')}${n(u.do_nicho, 'do nicho')}${n(u.soltas ?? u.novas, 'para revisar')}</div>${frase}`
    + (u.repetidas_nome || u.fora_do_nicho ? `<p class="hint">${u.repetidas_nome ? `${u.repetidas_nome} repetida(s) pelo nome (outro canal ou loja). ` : ''}${u.fora_do_nicho ? `${u.fora_do_nicho} sem palavra do nicho no nome do produto.` : ''}</p>` : '')
    + (u.falhas && u.falhas.length ? `<p class="hint">Não abriu agora: ${u.falhas.map(c => '@' + esc(c)).join(', ')}</p>` : '');
}
async function rodarRadar(){
  if (RADAR) { document.getElementById('veu').classList.add('on'); document.getElementById('modal').classList.add('on'); return; }
  let r;
  try { r = await api('radar'); } catch(e) { r = {erro:'Sem conexão com o servidor.'}; }
  if (r.erro) return toast(r.erro, true);
  RADAR = {pedido: r.pedido, desde: r.desde, inicio: Date.now()};
  desenharRadar('pedido');
  document.getElementById('veu').classList.add('on'); document.getElementById('modal').classList.add('on');
  const passo = async () => {
    if (!RADAR) return;
    let s = {};
    try { s = await api('radar_status', '', {pedido: RADAR.pedido, desde: RADAR.desde}); } catch(e) {}
    if (!RADAR) return;
    const aberto = document.getElementById('modal').classList.contains('on');
    if (s.fase === 'pronto' || s.fase === 'erro') {
      const fim = RADAR; RADAR = null;
      if (aberto) { RADAR = fim; desenharRadar(s.fase, s); RADAR = null; }
      else toast(s.fase === 'pronto' ? (s.ultima.novas ? `Radar: ${s.ultima.novas} oferta(s) nova(s) em Revisar.` : 'Radar: nada novo agora.') : 'A rodada do radar deu erro.', s.fase === 'erro');
      carregar();
      return;
    }
    if (aberto) desenharRadar(s.fase || 'pedido', s);
    if (Date.now() - RADAR.inicio > 6 * 60e3) { RADAR = null; return; }
    setTimeout(passo, 4000);
  };
  setTimeout(passo, 3000);
}
function fecharRadar(){ document.getElementById('modal').classList.remove('on'); document.getElementById('veu').classList.remove('on'); }

  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast on' + (erro ? ' erro' : '');
  clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', erro ? 5000 : 2600);
}
function confirmarP(titulo, texto, botao){
  return new Promise(res => {
    const m = document.getElementById('modal');
    m.innerHTML = `<h3>${esc(titulo)}</h3>${texto ? `<p>${esc(texto)}</p>` : '<p></p>'}<div class="acts"><button class="btn ghost" id="cf-n">Cancelar</button><button class="btn gold" id="cf-s">${esc(botao)}</button></div>`;
    const drawerAberto = document.getElementById('drawer').classList.contains('on');
    document.getElementById('veu').classList.add('on'); m.classList.add('on');
    const fim = v => { m.classList.remove('on'); if (!drawerAberto) document.getElementById('veu').classList.remove('on'); res(v); };
    document.getElementById('cf-n').onclick = () => fim(false);
    document.getElementById('cf-s').onclick = () => fim(true);
  });
}
async function confirmar(titulo, texto, botao, acao){ if (await confirmarP(titulo, texto, botao)) acao(null); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharTudo(); });
document.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]');
  if (ed && !e.target.closest('button,a,input,textarea,label,select')) return editar(ed.dataset.edit, ed.dataset.id);
  const c = e.target.closest('[data-url]');
  if (!c || e.target.closest('button,a,input,textarea,label,select')) return;
  window.open(c.dataset.url, '_blank', 'noopener');
});

pagina = location.hash.slice(1) || 'inicio';
carregar();
// Com a aba escondida só continua conferindo se os avisos do navegador estiverem ligados (para poder notificar).
setInterval(() => { if (!document.hidden || avisosLigados()) carregar(false, true); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregar(false, true); });
</script>
